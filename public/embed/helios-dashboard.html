<!DOCTYPE html>
<!-- Interactief voorbeeld van het Helios-dashboard voor professionals, in een iframe in de hero van /voor-professionals.
     Uit het ontwerp "Helios Dashboard - interactief"; aangepast: Inter van de eigen site, het officiële logo, alleen de app (978 × 735), doorzichtige achtergrond.
     Alle namen en cijfers zijn voorbeeldgegevens. -->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios-dashboard (voorbeeld)</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Inter';src:url(/fonts/inter-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'Inter';src:url(/fonts/inter-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}@font-face{font-family:'Inter';src:url(/fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}@font-face{font-family:'Inter';src:url(/fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:transparent;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#14122e;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:#3b1ff5;text-decoration:none}
#fit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#canvas{position:relative;width:978px;height:735px;flex:none;background:transparent;transform-origin:center}
#app{position:absolute;left:0;top:0;width:978px;height:735px;border-radius:26px;background:#f6f5fc;overflow:hidden}

/* zijbalk */
aside{position:absolute;left:0;top:0;width:220px;padding:26px 18px}
.logo{display:flex;align-items:center;gap:8px;padding-left:4px}
.logo img{display:block;height:40px;width:auto}
.logo .logo-dark,html[data-theme=dark] .logo .logo-light{display:none}
html[data-theme=dark] .logo .logo-dark{display:block}
nav{display:flex;flex-direction:column;gap:6px;margin-top:32px}
.nav{display:flex;align-items:center;gap:22px;height:48px;padding:0 14px;border:0;border-radius:12px;background:none;color:#14122e;font-size:15.5px;text-align:left;transition:background .2s}
.nav svg{color:#5a5880;flex:none}
.nav:hover{background:#efedfb}
.nav.is-active{background:#ebe8fb;font-weight:500}
.nav.is-active svg{color:#3b1ff5}

/* kop */
header{position:absolute;left:220px;top:0;width:758px;height:133px;background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(70,50,190,.05)}
.h-label{position:absolute;left:30px;top:24px;font-size:12.5px;font-weight:500;color:#6b6a8c;display:flex;align-items:center;gap:6px}
.h-label button{border:0;background:none;padding:0;color:#3b1ff5;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:4px}
h1{position:absolute;left:30px;top:36px;margin:0;font-size:29px;font-weight:700;letter-spacing:-.035em}
h1.low{top:42px}
.h-sub{position:absolute;left:30px;top:80px;font-size:13.5px;color:#6b6a8c;max-width:470px;line-height:1.4}
.profile{position:absolute;right:30px;top:28px;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#8b5cf6,#3b1ff5);flex:none}
.h-tabs{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;font-size:15.5px}
.h-tab{border:0;background:none;padding:0 14px 18px;color:#5a5880;border-bottom:3px solid transparent;font-size:15.5px}
.h-tab.is-active{color:#14122e;font-weight:600;border-bottom-color:#3b1ff5}
.h-action{position:absolute;right:30px;top:80px}

/* algemene bouwstenen */
.card{position:absolute;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(70,50,190,.05)}
.content{position:absolute;left:234px;top:153px;width:734px;height:564px}
.t2{margin:0;font-size:17.5px;font-weight:700;letter-spacing:-.02em}
.t3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.muted{color:#6b6a8c}
.link{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:12.5px;font-weight:500;color:#3b1ff5}
.link:hover{color:#2a12c9}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:background .2s,border-color .2s}
.btn-p{background:#3b1ff5;color:#fff}
.btn-p:hover{background:#2a12c9}
.btn-s{background:#fff;border-color:#e4e2f0;color:#14122e}
.btn-s:hover{border-color:#c9c0f7}
.btn-sm{height:30px;padding:0 12px;font-size:12.5px;border-radius:8px}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:#d9d4f5 transparent}
.tile{flex:none;display:grid;place-items:center;border-radius:10px;background:#efedfb;color:#3b1ff5}
.bar{display:block;height:8px;border-radius:4px;background:#ecebf6;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:#3b1ff5;width:var(--w)}
.bar.anim>i{width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.on .bar.anim>i{width:var(--w)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.s-actief,.s-afgerond{background:#e9f8ee;color:#13883a}
.s-niet{background:#fdecee;color:#c4283c}
.s-uitgenodigd{background:#eaf0ff;color:#2a55d8}
.s-wacht{background:#fff3e6;color:#c76a0b}
.s-bezig{background:#efebff;color:#4a2ff6}
.s-todo{background:#f0eff6;color:#5a5880}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#f2f0fb;color:#3a3858;font-size:12px;white-space:nowrap}
.tag.green{background:#e9f8ee;color:#13883a}
.rowbtn{display:flex;align-items:center;width:100%;border:0;background:none;padding:0;text-align:left;border-radius:10px;transition:background .15s}
.rowbtn:hover{background:#f6f5fc}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 13px;border-radius:999px;border:1px solid #e4e2f0;background:#fff;font-size:12.5px;color:#3a3858}
.chip.is-active{background:#ebe8fb;border-color:#ebe8fb;color:#3b1ff5;font-weight:600}
input,select{font-family:inherit;font-size:13.5px;color:#14122e;height:38px;border:1px solid #e4e2f0;border-radius:10px;background:#fff;padding:0 12px;outline:none}
input:focus,select:focus{border-color:#8b74f8;box-shadow:0 0 0 3px rgba(91,63,245,.12)}
ul.dots{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:#2c2a48}
ul.dots li+li{margin-top:4px}
p.body{margin:0;font-size:13.5px;line-height:1.6;color:#2c2a48}

/* overzicht */
.radar-shape{transform:scale(0);transform-origin:177px 168px;opacity:0;transition:transform 1.3s cubic-bezier(.2,.8,.2,1) .2s,opacity .4s ease .2s}
.on .radar-shape{transform:scale(1);opacity:1}
.grow{height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.on .grow{height:var(--h)}
.draw{stroke-dashoffset:1;transition:stroke-dashoffset 1.4s ease-in-out .2s}
.on .draw{stroke-dashoffset:0}
.fade{opacity:0;transition:opacity .5s ease}
.on .fade{opacity:1}
.clickable{cursor:pointer;transition:box-shadow .2s}
.clickable:hover{box-shadow:0 14px 36px rgba(70,50,190,.12)}

/* tabel cliënten */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{position:sticky;top:0;background:#faf9fe;text-align:left;font-weight:500;color:#6b6a8c;font-size:12px;padding:10px 12px;z-index:1}
.table td{padding:9px 12px;border-top:1px solid #f0eff7;vertical-align:middle}
.table tr.click{cursor:pointer}
.table tr.click:hover td{background:#f8f7fd}
.mini-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:#3b1ff5;background:#ebe8fb;flex:none}

/* modaal */
#modal{position:absolute;inset:0;z-index:20;display:none}
#modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(20,18,46,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .2s ease}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:660px;height:650px;background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(20,10,80,.25);display:flex;flex-direction:column;overflow:hidden;animation:pop .28s cubic-bezier(.2,.8,.2,1)}
.sheet.small{width:460px;height:auto;max-height:640px}
.sheet-head{position:relative;padding:24px 28px 0}
.sheet-close{position:absolute;right:18px;top:18px;width:34px;height:34px;border-radius:50%;border:0;background:#f4f2fc;display:grid;place-items:center;color:#3a3858}
.sheet-close:hover{background:#ebe8fb}
.sheet-tabs{display:flex;gap:22px;margin-top:18px;border-bottom:1px solid #eeecf7;padding:0 28px}
.sheet-tab{border:0;background:none;padding:0 0 12px;font-size:13.5px;color:#5a5880;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.sheet-tab.is-active{color:#3b1ff5;font-weight:600;border-bottom-color:#3b1ff5}
.sheet-body{flex:1;padding:22px 28px 28px}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 28px 22px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fact{background:#f8f7fd;border-radius:12px;padding:12px 14px}
.fact b{display:block;font-size:15px;letter-spacing:-.01em}
.fact span{display:block;font-size:11.5px;color:#6b6a8c;margin-top:3px}
.sec+.sec{margin-top:22px}
.sec h4{margin:0 0 9px;font-size:14px;font-weight:700}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.reason{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#f8f7fd;font-size:13px;line-height:1.5}
.reason+.reason{margin-top:8px}
.reason .tile{width:30px;height:30px;border-radius:9px}
.reason small{display:block;color:#6b6a8c;font-size:11.5px;margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:#3a3858}
.err{font-size:12px;color:#c4283c;margin-top:8px;min-height:16px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #eeecf7;border-radius:10px;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;padding:0;accent-color:#3b1ff5}
.check+.check{margin-top:6px}

#toast{position:absolute;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:30;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;background:#14122e;color:#fff;font-size:13px;box-shadow:0 14px 30px rgba(20,10,80,.3);transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%) scale(.98)}}

/* rapport-voorbeeld */
.paper{width:206px;aspect-ratio:210/297;background:#fff;border-radius:6px;box-shadow:0 12px 30px rgba(40,30,120,.14),0 0 0 1px #eeecf7;padding:22px 22px;font-size:8px;color:#2c2a48;flex:none;overflow:hidden}
.paper .p-band{height:64px;margin:-22px -22px 14px;padding:14px 22px;background:linear-gradient(120deg,#3b1ff5,#8b5cf6);color:#fff}
.paper .p-band b{display:block;font-size:13px;letter-spacing:-.01em}
.paper h5{margin:10px 0 5px;font-size:9px;font-weight:700;color:#14122e}
.paper .p-line{height:4px;border-radius:2px;background:#eeecf7;margin-top:4px}

<script>
// Licht of donker zoals de website eromheen; los geopend: de keuze in localStorage of die van het apparaat.
(function () {
  function theme() {
    var t = null;
    try { if (window.parent !== window) t = window.parent.document.documentElement.getAttribute('data-theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') { try { t = localStorage.getItem('helios-theme'); } catch (e) {} }
    if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }
  theme();
  try {
    if (window.parent !== window) new MutationObserver(theme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) {}
  addEventListener('storage', theme);
})();
</script>

<body>
<div id="fit"><div id="canvas">
  <div id="app">
    <aside>
      <div class="logo"><img class="logo-light" src="/assets/logo-helios.png" alt="Helios" width="129" height="40"><img class="logo-dark" src="/assets/logo-helios-dark.png" alt="Helios" width="129" height="40"></div>
      <nav id="nav"></nav>
    </aside>
    <header id="head"></header>
    <div id="view"></div>
    <div id="modal"></div>

const isDone = (v) => typeof v === 'string';
const progress = (c) => { const k = Object.keys(c.tests); return [k.filter((t) => isDone(c.tests[t])).length, k.length]; };

// Alle afgeronde testen als uitslagen, nieuwste eerst (datums zijn allemaal 2026).
const MONTHS = { sep: 9, okt: 10, nov: 11 };
const dateKey = (d) => { const [day, m] = d.split(' '); return MONTHS[m] * 100 + Number(day); };
function results(clientId) {
  const out = [];
  for (const c of CLIENTS) {
    if (clientId && c.id !== clientId) continue;
    for (const [t, v] of Object.entries(c.tests)) if (isDone(v)) out.push({ key: `${c.id}-${t}`, client: c.id, test: t, date: v });
  }
  return out.sort((a, b) => dateKey(b.date) - dateKey(a.date));
}

      <div class="sec"><h4>Alle talenten</h4>${TALENTEN.map(([n, p]) => `<div style="display:flex;align-items:center;gap:10px;height:30px;font-size:13px"><span style="flex:1">${n}</span>${bar(p, 160)}<span style="width:36px;text-align:right;font-weight:600">${p}%</span></div>`).join('')}</div>

  } else if (r.test === 'swiper') {
    body = `<div style="display:flex;gap:10px;margin-top:16px"><div class="fact" style="flex:1"><b>14 van 81</b><span>opleidingen geliket</span></div><div class="fact" style="flex:1"><b>Mens en maatschappij</b><span>meest gekozen richting</span></div></div>
      <div class="sec"><h4>Opleidingen die ${esc(c.first)} leuk vindt</h4>${SWIPED.map((id) => { const o = OPLEIDINGEN[id]; return o

        : `<div style="display:flex;align-items:center;gap:12px;padding:8px;border-bottom:1px solid #f0eff7"><span class="tile" style="width:32px;height:32px;border-radius:50%">${ic('grad', 16, 2)}</span><span style="flex:1;font-size:13.5px">${id}</span><span class="tag" style="height:20px;font-size:11px">HBO Bachelor</span></div>`; }).join('')}</div>`;
  }
  return head + body;
}

}

function euro(n) { return '€ ' + n.toLocaleString('nl-NL'); }

function beroepSheet(id, tab) {

  let body = '';
  if (tab === 'overzicht') {
    body = `<div class="facts"><div class="fact"><b>${euro(b.salaris[0])}+</b><span>startsalaris per maand</span></div><div class="fact"><b>${b.niveau.replace('-niveau', '')}</b><span>opleidingsniveau</span></div><div class="fact"><b>${b.kans}</b><span>kans op werk</span></div><div class="fact"><b>${b.omgevingTags[3]}</b><span>per week</span></div></div>
      <div class="sec" style="margin-top:20px"><h4>Wat doet een ${lc(b.name)}?</h4><p class="body">${b.wat}</p></div>
      <div class="sec cols"><div><h4>Werkzaamheden</h4><ul class="dots">${b.taken.map((t) => `<li>${t}</li>`).join('')}</ul></div>
      <div><h4>Werkomgeving</h4><p class="body" style="font-size:13px">${b.omgeving}</p><div class="chips" style="margin-top:10px">${b.omgevingTags.slice(0, 3).map((t) => `<span class="tag">${t}</span>`).join('')}</div></div></div>`;
  } else if (tab === 'salaris') {

    body = `<div class="sec"><h4>Salarisindicatie</h4><div style="font-size:26px;font-weight:700;letter-spacing:-.03em">${euro(lo)} – ${euro(hi)}</div><div class="muted" style="font-size:12.5px;margin-top:4px">Bruto per maand bij een volledige werkweek, exclusief vakantiegeld</div>
      <div style="position:relative;height:46px;margin-top:20px"><div style="position:absolute;left:0;right:0;top:12px;height:10px;border-radius:5px;background:#ecebf6"></div>
      <div style="position:absolute;left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%;top:12px;height:10px;border-radius:5px;background:linear-gradient(90deg,#8b5cf6,#3b1ff5)"></div>
      <div style="position:absolute;left:${pos(lo)}%;top:28px;transform:translateX(-50%);font-size:11.5px;color:#3a3858">Starter</div>
      <div style="position:absolute;left:${pos(hi)}%;top:28px;transform:translateX(-50%);font-size:11.5px;color:#3a3858">Ervaren</div>
      <div style="position:absolute;left:${pos(b.senior)}%;top:6px;width:2px;height:22px;background:#c9c0f7"></div><div style="position:absolute;left:${pos(b.senior)}%;top:28px;transform:translateX(-50%);font-size:11.5px;color:#6b6a8c;white-space:nowrap">Senior ${euro(b.senior)}</div></div></div>
      <div class="sec"><h4>Arbeidsmarkt</h4><div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><div style="display:flex;gap:4px">${[1, 2, 3, 4, 5].map((i) => `<span style="width:26px;height:8px;border-radius:4px;background:${i <= b.arbeid ? '#1fa64a' : '#ecebf6'}"></span>`).join('')}</div><b style="font-size:13.5px;color:#13883a">${b.kans}</b></div><p class="body">${b.arbeidTekst}</p></div>
      <div class="sec"><h4>Doorgroeien</h4><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${[b.name, ...b.groei].map((g, i) => `${i ? `<span style="color:#b3a9ef">${ic('arrowR', 14, 2)}</span>` : ''}<span class="tag"${i ? '' : ' style="background:#ebe8fb;color:#3b1ff5;font-weight:600"'}>${g}</span>`).join('')}</div></div>`;
  } else if (tab === 'opleidingen') {
    body = `<p class="body muted">Met deze opleidingen kun je ${lc(b.name)} worden. Gevraagd niveau: <b style="color:#14122e">${b.niveau.toLowerCase()}</b>.</p>
      <div style="margin-top:12px">${b.opl.map((oid) => { const o = OPLEIDINGEN[oid]; return `<button class="rowbtn" style="gap:14px;padding:12px;border:1px solid #eeecf7;margin-bottom:8px" data-opl="${oid}">

      <div class="sec"><h4>Bespreekvraag voor het gesprek</h4><p class="body">Wat spreekt ${esc(c.first)} het meest aan in het werk van een ${lc(b.name)}, en wat juist niet?</p></div>`;
  }
  return `<div class="sheet"><div class="sheet-head">
      <button class="sheet-close" data-close aria-label="Sluiten">${ic('x', 16, 2.2)}</button>

        <div style="text-align:right"><div style="font-size:24px;font-weight:700;letter-spacing:-.03em">${b.match}%</div><div style="font-size:11.5px;color:#6b6a8c;margin:2px 0 6px">match</div>${bar(b.match, 90)}</div>

function oplSheet(id, tab) {

    body = `<div class="facts"><div class="fact"><b>${o.duur}</b><span>studieduur</span></div><div class="fact"><b>${o.ec}</b><span>studiepunten</span></div><div class="fact"><b>${o.niveau}</b><span>niveau</span></div><div class="fact"><b>${o.vormen.length > 1 ? o.vormen.length + ' vormen' : o.vormen[0]}</b><span>${o.vormen.join(', ').toLowerCase()}</span></div></div>
      <div class="sec" style="margin-top:20px"><h4>Wat houdt de opleiding in?</h4><p class="body">${o.wat}</p></div>
      <div class="sec cols"><div><h4>Wat leer je?</h4><ul class="dots">${o.vakken.map((v) => `<li>${v}</li>`).join('')}</ul></div>
      <div><h4>Hiermee kun je worden</h4><div class="chips">${o.beroepen.map((x) => BEROEPEN[x] ? `<button class="tag" style="border:0;cursor:pointer;background:#ebe8fb;color:#3b1ff5;font-weight:500" data-beroep="${x}">${BEROEPEN[x].name}</button>` : `<span class="tag">${x}</span>`).join('')}</div></div></div>`;
  } else if (tab === 'duur') {
    body = `<div class="facts" style="grid-template-columns:repeat(3,1fr)"><div class="fact"><b>${o.duur}</b><span>${o.ec}</span></div><div class="fact"><b style="font-size:13px">${o.diploma}</b><span>diploma</span></div><div class="fact"><b style="font-size:13px">${o.start.split(' (')[0]}</b><span>start</span></div></div>
      <div class="sec" style="margin-top:20px"><h4>Opbouw</h4><div style="display:flex;gap:6px">${Array.from({ length: parseInt(o.duur, 10) }, (_, i) => `<div style="flex:1;border-radius:10px;padding:10px 12px;background:${['#efebff', '#e4ddfd', '#d5c9fc', '#c4b5fd'][i]};font-size:12px"><b style="display:block;font-size:13px">Jaar ${i + 1}</b>${i === 0 ? 'Propedeuse en basisvakken' : i === parseInt(o.duur, 10) - 1 ? 'Afstuderen' : i === 1 ? 'Verdieping' : 'Stage en minor'}</div>`).join('')}</div></div>
      <div class="sec"><h4>Toelating</h4><ul class="dots">${o.toelating.map((t) => `<li>${t}</li>`).join('')}</ul></div>
      <div class="sec"><h4>Studievormen</h4><div class="chips">${o.vormen.map((v) => `<span class="tag">${v}</span>`).join('')}</div>${o.start.includes('(') ? `<p class="body muted" style="margin-top:8px;font-size:12.5px">${o.start}</p>` : ''}</div>
      <div class="sec"><h4>Na je diploma</h4><p class="body">${o.vervolg}</p></div>`;
  } else if (tab === 'scholen') {
    body = o.scholen.map(([n, p, v]) => `<div style="display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid #f0eff7"><span class="tile" style="width:40px;height:40px">${ic('school', 20)}</span><div style="flex:1"><b style="font-size:14px">${n}</b><div style="font-size:12px;color:#6b6a8c;margin-top:3px;display:flex;align-items:center;gap:4px">${ic('pin', 13)}${p}</div></div><span class="tag">${v}</span></div>`).join('');
  } else {
    body = `<p class="body muted" style="margin-bottom:12px">Met een diploma ${o.name} kun je onder andere aan de slag als:</p>${o.beroepen.map(beroep).join('')}`;
  }
  return `<div class="sheet"><div class="sheet-head">
      <button class="sheet-close" data-close aria-label="Sluiten">${ic('x', 16, 2.2)}</button>
      <div style="display:flex;gap:16px;align-items:center;padding-right:44px">
        <span class="tile" style="width:54px;height:54px;border-radius:50%">${ic('grad', 26, 2)}</span>
        <div style="flex:1"><div style="font-size:12px;color:#6b6a8c;font-weight:500">Opleiding · ${o.scholen.length} scholen</div><h2 style="margin:2px 0 0;font-size:24px;letter-spacing:-.03em">${o.name}</h2><div style="display:flex;gap:6px;margin-top:7px">${[o.niveau, o.duur, ...o.vormen].map((t) => `<span class="tag" style="height:22px;font-size:11.5px">${t}</span>`).join('')}</div></div>
        <div style="text-align:right"><div style="font-size:24px;font-weight:700;letter-spacing:-.03em">${o.match}%</div><div style="font-size:11.5px;color:#6b6a8c;margin:2px 0 6px">match</div>${bar(o.match, 90)}</div>
      </div></div>
    <div class="sheet-tabs">${tabs.map(([t, l]) => `<button class="sheet-tab${tab === t ? ' is-active' : ''}" data-tab="${t}">${l}</button>`).join('')}</div>
    <div class="sheet-body scroll">${body}</div></div>`;
}

function inviteSheet() {
  return `<div class="sheet small"><div class="sheet-head"><button class="sheet-close" data-close aria-label="Sluiten">${ic('x', 16, 2.2)}</button>
    <h2 style="margin:0;font-size:22px;letter-spacing:-.03em">Nieuwe cliënt uitnodigen</h2><p class="body muted" style="margin-top:4px">De cliënt ontvangt een uitnodiging per e-mail.</p></div>
    <form data-form="invite" style="padding:18px 28px 0" novalidate>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="field">Voornaam<input name="first" placeholder="Voornaam"></label><label class="field">Achternaam<input name="last" placeholder="Achternaam"></label></div>
      <label class="field" style="margin-top:10px">E-mailadres<input name="email" type="email" placeholder="naam@voorbeeld.nl"></label>
      <div class="field" style="margin-top:14px">Testen toewijzen
        <div class="chips">${Object.entries(TESTS).map(([id, t]) => `<label class="chip" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="t" value="${id}"${['beroep', 'waarden'].includes(id) ? ' checked' : ''} style="width:14px;height:14px;padding:0;accent-color:#3b1ff5">${t.name}</label>`).join('')}</div></div>
      <div class="err" data-err></div>
      <div class="sheet-foot" style="padding:6px 0 22px"><button type="button" class="btn btn-s" data-close>Annuleren</button><button class="btn btn-p">${ic('mail', 16)}Uitnodiging versturen</button></div>
    </form></div>`;
}

function assignSheet(testId, clientId) {
  const head = testId ? `${TESTS[testId].name} toewijzen` : `Test toewijzen aan ${esc(client(clientId).first)}`;
  const items = testId
    ? CLIENTS.filter((c) => !(testId in c.tests)).map((c) => `<label class="check"><input type="checkbox" name="x" value="${c.id}">${esc(fullName(c))}<span class="muted" style="margin-left:auto;font-size:12px">${STATUS[c.status][0]}</span></label>`)
    : Object.entries(TESTS).filter(([id]) => !(id in client(clientId).tests)).map(([id, t]) => `<label class="check"><input type="checkbox" name="x" value="${id}">${ic(t.icon, 16)}${t.name}<span class="muted" style="margin-left:auto;font-size:12px">${t.dur.split(' · ')[0]}</span></label>`);
  return `<div class="sheet small"><div class="sheet-head"><button class="sheet-close" data-close aria-label="Sluiten">${ic('x', 16, 2.2)}</button>
    <h2 style="margin:0;font-size:22px;letter-spacing:-.03em">${head}</h2><p class="body muted" style="margin-top:4px">${testId ? 'Kies de cliënten die deze test moeten maken.' : 'Kies de testen die erbij komen. De cliënt krijgt een melding.'}</p></div>
    <form data-form="assign" data-test="${testId || ''}" data-client="${clientId || ''}" style="padding:16px 28px 0" novalidate>
      <div class="scroll" style="max-height:330px">${items.join('') || '<p class="body muted">Alles is al toegewezen.</p>'}</div>
      <div class="err" data-err></div>
      <div class="sheet-foot" style="padding:6px 0 22px"><button type="button" class="btn btn-s" data-close>Annuleren</button><button class="btn btn-p">Toewijzen</button></div>
    </form></div>`;
}

function reportSheet(clientId) {
  const options = CLIENTS.filter((c) => results(c.id).length);
  return `<div class="sheet small"><div class="sheet-head"><button class="sheet-close" data-close aria-label="Sluiten">${ic('x', 16, 2.2)}</button>
    <h2 style="margin:0;font-size:22px;letter-spacing:-.03em">Nieuwe rapportage</h2><p class="body muted" style="margin-top:4px">Kies voor wie het rapport is en wat erin komt.</p></div>
    <form data-form="report" style="padding:16px 28px 0" novalidate>
      <label class="field">Cliënt<select name="client">${options.map((c) => `<option value="${c.id}"${c.id === clientId ? ' selected' : ''}>${esc(fullName(c))}</option>`).join('')}</select></label>
      <div class="field" style="margin-top:14px">Onderdelen${PARTS.map((p) => `<label class="check"><input type="checkbox" name="p" value="${p}" checked>${p}</label>`).join('')}</div>
      <div class="err" data-err></div>
      <div class="sheet-foot" style="padding:6px 0 22px"><button type="button" class="btn btn-s" data-close>Annuleren</button><button class="btn btn-p">${ic('file', 16)}Rapportage maken</button></div>
    </form></div>`;
}

/* ---------- Weergeven ---------- */
function renderView() {
  const v = document.getElementById('view');
  v.classList.remove('on');
  if (S.screen === 'dashboard' || S.screen === 'client') {
    const c = client(S.client);
    if (S.ctab === 'tests') v.innerHTML = clientTests(c);
    else if (S.ctab === 'resultaten') v.innerHTML = resultsView(c.id);
    else v.innerHTML = c.id === 1 ? overviewLars() : overviewOther(c);
  } else if (S.screen === 'clients') v.innerHTML = clientsView();
  else if (S.screen === 'tests') v.innerHTML = testsView();
  else if (S.screen === 'results') v.innerHTML = resultsView(0);
  else v.innerHTML = reportsView();
  requestAnimationFrame(() => requestAnimationFrame(() => v.classList.add('on')));
}

function renderModal() {
  const m = document.getElementById('modal');
  if (!S.modal) { m.classList.remove('open'); m.innerHTML = ''; return; }
  const { type, id, tab } = S.modal;
  const sheet = type === 'beroep' ? beroepSheet(id, tab) : type === 'opl' ? oplSheet(id, tab) : type === 'invite' ? inviteSheet() : type === 'assign' ? assignSheet(id, S.modal.client) : reportSheet(S.modal.client);
  m.innerHTML = `<div class="backdrop" data-close></div>${sheet}`;
  m.classList.add('open');
  const first = m.querySelector('input:not([type=checkbox])');
  if (first) first.focus();
}

function render() { renderNav(); renderHead(); renderView(); renderModal(); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span style="color:#7ee2a0">${ic('checkCircle', 17)}</span>${esc(msg)}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Interactie ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go],[data-ctab],[data-client],[data-result],[data-pick],[data-beroep],[data-opl],[data-tab],[data-close],[data-act],[data-assign],[data-tfilter],[data-report],[data-share],[data-toast]');
  if (!el || el.closest('form') && !el.matches('[data-close]')) return;
  const d = el.dataset;
  if ('close' in d) { S.modal = null; renderModal(); return; }
  if (d.go) { S.screen = d.go; S.modal = null; if (d.go === 'dashboard') { S.client = 1; S.ctab = 'overzicht'; } render(); return; }
  if (d.ctab) { S.ctab = d.ctab; render(); return; }
  if (d.result) {
    const cid = Number(d.result.split('-')[0]);
    S.result = d.result; S.modal = null; S.client = cid;
    // Vanuit een cliënt blijf je bij die cliënt (tab Resultaten); vanaf andere schermen open je de cliënt.
    if (S.screen !== 'results') { S.ctab = 'resultaten'; if (S.screen !== 'dashboard') S.screen = 'client'; }
    render(); return;
  }
  if (d.pick) { S.result = d.pick; S.client = Number(d.pick.split('-')[0]); renderView(); return; }
  if (d.beroep) { S.modal = { type: 'beroep', id: d.beroep, tab: 'overzicht' }; renderModal(); return; }
  if (d.opl) { S.modal = { type: 'opl', id: d.opl, tab: 'overzicht' }; renderModal(); return; }
  if (d.tab) { S.modal.tab = d.tab; renderModal(); return; }
  if (d.act === 'invite') { S.modal = { type: 'invite' }; renderModal(); return; }
  if (d.act === 'newReport') { S.modal = { type: 'report', client: Number(d.client) || S.client }; renderModal(); return; }
  if (d.act === 'assignClient') { S.modal = { type: 'assign', id: null, client: S.client }; renderModal(); return; }
  if (d.assign) { S.modal = { type: 'assign', id: d.assign, client: null }; renderModal(); return; }
  if (d.tfilter) { S.tfilter = d.tfilter; renderView(); return; }
  if (d.report) { S.report = Number(d.report); renderView(); return; }
  if (d.share) { const r = REPORTS.find((x) => x.id === Number(d.share)); r.shared = true; renderView(); toast(`Rapport gedeeld met ${client(r.client).first}`); return; }
  if (d.toast) { toast(d.toast); return; }
  if (d.client) { S.client = Number(d.client); S.ctab = 'overzicht'; S.screen = 'client'; render(); }
});

document.addEventListener('input', (e) => {
  if (e.target.matches('[data-q]')) { S.q = e.target.value; const pos = e.target.selectionStart; renderView(); const i = document.querySelector('[data-q]'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('change', (e) => {
  if (e.target.matches('[data-status]')) { S.status = e.target.value; renderView(); }
  if (e.target.matches('[data-rfilter]')) { S.rfilter = e.target.value; renderView(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal) { S.modal = null; renderModal(); } });

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, err = f.querySelector('[data-err]');
  const fail = (msg) => { err.textContent = msg; };
  f.addEventListener('input', () => { err.textContent = ''; }, { once: true });
  if (f.dataset.form === 'invite') {
    const first = f.first.value.trim(), last = f.last.value.trim(), email = f.email.value.trim();
    const tests = [...f.querySelectorAll('[name=t]:checked')].map((x) => x.value);
    if (!first || !last) return fail('Vul een voornaam en achternaam in.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('Vul een geldig e-mailadres in.');
    if (!tests.length) return fail('Kies minstens één test.');
    CLIENTS.unshift({ id: Date.now(), first, last, email, status: 'uitgenodigd', created: '4 nov 2026', tests: Object.fromEntries(tests.map((t) => [t, 0])) });
    S.modal = null; S.screen = 'clients'; S.q = ''; S.status = 'alle'; render();
    toast(`Uitnodiging verstuurd naar ${email}`);
  } else if (f.dataset.form === 'assign') {
    const picked = [...f.querySelectorAll('[name=x]:checked')].map((x) => x.value);
    if (!picked.length) return fail('Kies minstens één.');
    if (f.dataset.test) {
      picked.forEach((id) => { client(Number(id)).tests[f.dataset.test] = 0; });
      toast(`${TESTS[f.dataset.test].name} toegewezen aan ${picked.length} ${picked.length === 1 ? 'cliënt' : 'cliënten'}`);
    } else {
      const c = client(Number(f.dataset.client));
      picked.forEach((t) => { c.tests[t] = 0; });
      toast(`${picked.length === 1 ? TESTS[picked[0]].name : picked.length + ' testen'} toegewezen aan ${c.first}`);
    }
    S.modal = null; render();
  } else if (f.dataset.form === 'report') {
    const parts = [...f.querySelectorAll('[name=p]:checked')].map((x) => x.value);
    if (!parts.length) return fail('Kies minstens één onderdeel.');
    const id = Date.now();
    REPORTS.unshift({ id, client: Number(f.client.value), title: 'Loopbaanrapport', date: '4 nov 2026', pages: 2 + parts.length * 2, shared: false, parts });
    S.modal = null; S.screen = 'reports'; S.report = id; render();
    toast('Rapportage gemaakt');
  }
});

/* Schalen: het canvas (1058 × 1030) past altijd in het venster. */
function fit() { const s = Math.min(innerWidth / 978, innerHeight / 735); document.getElementById('canvas').style.transform = `scale(${s})`; }
addEventListener('resize', fit);
fit();
render();
</script>
</body>
</html>
